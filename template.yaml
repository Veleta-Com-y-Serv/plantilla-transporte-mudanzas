# Metadatos de la plantilla para el catálogo de NoExpertise.
id: transporte-mudanzas
nombre: Transporte y mudanzas
descripcion: "Web robusta a todo el ancho para mudanzas y transporte: flota, cobertura, proceso y presupuesto de ruta."
sectores:
  - { id: transporte, nombre: Transporte }
  - { id: mudanzas, nombre: Mudanzas }
  - { id: logistica, nombre: Logística }
  - { id: mensajeria, nombre: Mensajería }
  - { id: taxi, nombre: Taxi y VTC }
  - { id: grua, nombre: Grúa y asistencia }
secciones:
  - { id: hero, nombre: Portada }
  - { id: servicios, nombre: Servicios }
  - { id: flota, nombre: Flota }
  - { id: zonas, nombre: Cobertura }
  - { id: proceso, nombre: Cómo trabajamos }
  - { id: cifras, nombre: Cifras }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: presupuesto, nombre: Pedir presupuesto }
  - { id: contacto, nombre: Contacto }
estilo: robusto
plan_minimo: gratis
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-transporte-mudanzas.noexpertise.com
activa: true
orden: 400

# Páginas propias (docs/plantillas.md § Fichas por elemento y páginas por zona). Espejo en src/data/fichas.ts.
fichas:
  - { lista: servicios, campo: items, ruta: servicios, nombre: Servicio, tipo: Service }
zonas:
  ruta: zonas

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu empresa"
    pregunta: "¿Cómo se llama tu empresa y qué transportes o mudanzas hacéis?"
    ayuda: "Mudanzas, portes, mensajería… y desde dónde trabajáis."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.destacado.titulo, secciones.hero.destacado.texto]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: servicios
    titulo: "Tus servicios"
    pregunta: "¿Qué servicios dais? Uno por línea: mudanzas, portes, guardamuebles…"
    tipo: texto
    campos: [secciones.servicios.titulo, secciones.servicios.texto, secciones.servicios.items]
  - id: flota
    titulo: "Tu flota"
    pregunta: "¿Qué vehículos tenéis? Uno por línea, con lo que cabe en cada uno si quieres."
    ayuda: "Las fotos de cada vehículo las pones luego en Contenido."
    tipo: lista
    campos: [secciones.flota.flota]
  - id: zonas
    titulo: "Dónde trabajáis"
    pregunta: "¿A qué pueblos, ciudades o provincias llegáis?"
    tipo: texto
    campos: [secciones.zonas.titulo, secciones.zonas.texto, secciones.zonas.items]
  - id: proceso
    titulo: "Cómo trabajáis"
    pregunta: "¿Cómo es una mudanza con vosotros, desde que os llaman hasta el final?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.items]
  - id: presupuesto
    titulo: "Pide presupuesto"
    pregunta: "¿Cómo dais un presupuesto? ¿Vais a verlo, por videollamada, es sin compromiso…?"
    tipo: texto
    campos: [secciones.presupuesto.titulo, secciones.presupuesto.texto, secciones.presupuesto.nota]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelas luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada (tu camión o tu furgoneta) y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.servicios.galeria, secciones.zonas.imagen, secciones.presupuesto.imagen, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
