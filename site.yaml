  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de mudarse
    preguntas:
      - { pregunta: "¿El presupuesto tiene coste?", respuesta: "No. Vamos a verlo o lo hacemos por videollamada y te damos un precio cerrado por escrito, sin compromiso." }
      - { pregunta: "¿Con cuánta antelación tengo que avisar?", respuesta: "Lo ideal son dos o tres semanas, sobre todo a final de mes y en verano. Para portes pequeños, muchas veces podemos ir el mismo día o al siguiente." }
      - { pregunta: "¿Qué pasa si se rompe algo?", respuesta: "Cada mudanza va con seguro a todo riesgo. Si algo sufre un daño, lo reparamos o te lo pagamos." }
      - { pregunta: "¿Tengo que embalar yo?", respuesta: "Como prefieras. Podemos dejarte las cajas para que embales tú o embalarlo todo nosotros el día antes." }
      - { pregunta: "¿Os encargáis del permiso para aparcar el camión?", respuesta: "Sí. Pedimos la reserva de espacio al ayuntamiento cuando hace falta y te avisamos cuando está concedida." }
      - { pregunta: "¿Puedo guardar los muebles unos días?", respuesta: "Sí. Tenemos guardamuebles vigilado en nuestra nave y te lo llevamos a la casa nueva cuando la tengas lista." }

