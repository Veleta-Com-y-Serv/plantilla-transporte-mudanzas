    titulo_pagina: "Mudanzas en {zona}"
    texto_pagina: "{negocio} hace mudanzas en {zona} con vehículo propio, equipo de confianza y presupuesto cerrado por escrito."
    texto: "Mudanzas a diario en la provincia de Castellón y rutas semanales al resto de la península. Si tu destino no está, pregúntanos."
    imagen: /fotos/cobertura.jpg
    cta: { texto: Consultar mi ruta, url: "/#presupuesto" }
    items:
      - titulo: Castelló de la Plana
        texto: "Es nuestra casa y donde más mudanzas hacemos. Trabajamos en el centro, en los barrios del Grau y de la zona universitaria y en las urbanizaciones de alrededor, con vehículos de distintos tamaños para entrar tanto en las calles estrechas del casco antiguo como en los bloques con garaje amplio. Hacemos mudanzas de pisos y casas, traslados de oficinas y comercios, portes pequeños y guardamuebles. Si el edificio no tiene ascensor o los muebles no caben por la escalera, valoramos el elevador exterior. Desde aquí salimos también hacia Almassora, Vila-real y el resto de la provincia, y te damos el presupuesto cerrado tras una visita o una videollamada sin compromiso."
      - titulo: Vila-real
        texto: "Mudanzas en Vila-real y su entorno, con salida diaria desde Castelló de la Plana. Movemos pisos del casco urbano, casas de las zonas de huerta y negocios del polígono, y organizamos el trabajo para que la carga y la descarga se hagan sin atascos en calles con tráfico o zonas azules. Si tu mudanza es entre Vila-real y Borriana, Nules o Onda, la ruta se resuelve en una sola jornada. Ofrecemos embalaje, desmontaje y montaje de muebles y trasteros vigilados por si la entrega de la vivienda nueva no coincide con la salida de la vieja. Pide presupuesto y te confirmamos fecha, hora de llegada y equipo por escrito."
      - titulo: Benicàssim
        texto: "En Benicàssim trabajamos con viviendas de vecindario y con chalés y apartamentos de la zona de playa y de las Villas. Muchas de estas casas tienen jardines, escaleras exteriores o accesos complicados, así que antes de la mudanza vemos el acceso y elegimos el vehículo y el equipo que mejor encajan. También atendemos a quien traslada su segunda residencia o cierra la temporada y necesita guardar los muebles unos meses. Cubrimos desde aquí los traslados hacia Orpesa, Castelló de la Plana y Vinaròs, además de rutas a Valencia y al resto de la península. Embalamos, montamos y colocamos lo que haga falta."
      - titulo: Almassora
        texto: "Almassora está a un paso de nuestra base, y eso se nota en el precio y en la disponibilidad. Hacemos mudanzas de pisos, de casas con patio y de pequeños negocios del casco urbano y de los polígonos cercanos, y prestamos portes puntuales de un mueble o de una compra grande. Para traslados entre Almassora, Castelló de la Plana y Vila-real organizamos el trabajo en una sola jornada y con el mismo equipo de principio a fin. Si necesitas cajas y material de embalaje, te los llevamos antes de la fecha, y si tu nueva casa aún no está lista, podemos custodiar tus muebles en nuestro guardamuebles."
      - titulo: Borriana
        texto: "En Borriana y el Grau hacemos mudanzas de pisos, casas de pueblo y viviendas cerca de la playa, con camiones de distintos tamaños según el acceso. Muchas calles del casco antiguo son estrechas, y por eso valoramos antes cómo va a entrar el vehículo, dónde se puede estacionar y si conviene usar el elevador exterior. Cubrimos los traslados desde y hacia Vila-real, Nules, Onda y Castelló de la Plana, y también las rutas semanales hacia Valencia, Madrid y Barcelona. Incluimos, si lo pides, embalaje, desmontaje y montaje, y te damos un presupuesto cerrado por escrito antes de empezar el trabajo."
      - { titulo: Onda }
      - { titulo: "L'Alcora" }
      - { titulo: Nules }
